<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Olivia 的一週時間表</title>
<style>
  :root{--ink:#27364b;--muted:#6e7d8e;--paper:#fffdf7;--line:#d8e3e8;--sky:#dff4ff;--mint:#ddf7e9;--yellow:#fff1b7;--coral:#ffd9ce;--lav:#e9e2ff;--blue:#bfe8ff;--shadow:0 8px 24px rgba(46,75,92,.12)}
  *{box-sizing:border-box;font-family:"KaiTi","STKaiti","Kaiti SC","BiauKai",serif} body{margin:0;background:#eef7f5;color:var(--ink);font-family:"KaiTi","STKaiti","Kaiti SC","BiauKai",serif}
  .app{max-width:1500px;margin:auto;padding:22px}.hero{background:linear-gradient(125deg,#fff7bf,#d9f5ec 58%,#d9efff);border:3px solid #fff;border-radius:28px;padding:22px 26px;box-shadow:var(--shadow);position:relative;overflow:hidden}.hero:after{content:"✦  ☁  ✿  ★";position:absolute;right:28px;top:20px;font-size:30px;color:#f5a85d;letter-spacing:12px;opacity:.7}.eyebrow{font-size:13px;font-weight:800;letter-spacing:2px;color:#ef8265}.hero h1{font-family:"KaiTi","STKaiti","Kaiti SC","BiauKai",serif;margin:5px 0 4px;font-size:clamp(28px,4vw,46px);color:#264c67}.hero p{margin:0;color:#527084;font-size:15px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0}.btn{border:0;border-radius:14px;padding:10px 14px;font-weight:800;color:var(--ink);background:#fff;box-shadow:0 3px 8px rgba(40,70,80,.12);cursor:pointer}.btn:hover{transform:translateY(-1px);box-shadow:0 5px 13px rgba(40,70,80,.16)}.btn.primary{background:#ffad82}.btn.green{background:#bfead4}.btn.blue{background:#bde5fa}.hint{margin:0 0 13px;color:var(--muted);font-size:13px}
  .schedule{display:grid;grid-template-columns:80px repeat(7,minmax(130px,1fr));gap:6px;min-width:1050px}.scroll{overflow-x:auto;padding-bottom:10px}.corner,.day{background:#fff;border-radius:15px 15px 8px 8px;box-shadow:0 3px 10px rgba(40,70,80,.08)}.corner{display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted);font-weight:800}.day{text-align:center;padding:11px 5px;font-weight:900;color:#355267}.day small{display:block;font-weight:600;color:#8a9aa4;margin-top:2px}.times{position:relative;background:rgba(255,255,255,.72);border-radius:14px;min-height:1040px}.time-label{height:40px;border-top:1px dashed var(--line);font-size:11px;color:#8796a0;text-align:right;padding:5px 7px 0 0}.time-label:first-child{border-top:0}.col{position:relative;min-height:1040px;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.72) 0,rgba(255,255,255,.72) 39px,rgba(210,224,228,.65) 40px);border-radius:14px;box-shadow:inset 0 0 0 1px rgba(210,224,228,.45)}.col.dragover{outline:3px dashed #f3a46e;outline-offset:-3px;background-color:#fff9e5}.block{position:absolute;left:6px;right:6px;min-height:28px;border-radius:13px;padding:7px 9px 7px 11px;box-shadow:0 4px 10px rgba(47,73,86,.13);cursor:grab;overflow:hidden;border:2px solid rgba(255,255,255,.88);transition:transform .12s,box-shadow .12s}.block:hover{transform:scale(1.02);box-shadow:0 7px 15px rgba(47,73,86,.2);z-index:20}.block:active{cursor:grabbing}.block strong{display:block;font-size:12px;line-height:1.15}.block span{display:block;font-size:10px;margin-top:3px;opacity:.8;font-weight:700}.school{background:#c9edff}.cca{background:#ffd6ad}.lesson{background:#e4dcff}.homework{background:#fff0ad}.sleep{background:#cfead8}.life{background:#ffd8e1}.block .tag{font-size:9px;opacity:.65;text-transform:uppercase;letter-spacing:.7px}.legend{display:flex;gap:14px;flex-wrap:wrap;margin:14px 0 4px;color:#607482;font-size:12px;font-weight:700}.dot{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:4px}.note{background:#fff;border:1px solid #e2eaed;border-radius:16px;padding:13px 15px;margin-top:18px;color:#6c7a82;font-size:12px;line-height:1.6}.modal{position:fixed;inset:0;background:rgba(31,51,65,.42);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}.modal.open{display:flex}.dialog{width:min(460px,100%);background:var(--paper);border-radius:23px;padding:21px;box-shadow:0 18px 50px rgba(24,50,64,.3)}.dialog h2{margin:0 0 15px;font-size:22px}.form{display:grid;gap:10px}.form label{font-size:12px;font-weight:900;color:#61737f}.form input,.form select{width:100%;border:2px solid #dce7ea;border-radius:11px;padding:10px;font:inherit;background:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.swatches{display:flex;gap:8px}.swatch{width:28px;height:28px;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 1px #ccd9dd;cursor:pointer}.swatch.selected{box-shadow:0 0 0 3px #ef986b}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.delete{margin-right:auto;background:#ffe0dc;color:#b44a42}.print-only{display:none}
  @media print{body{background:#fff}.app{max-width:none;padding:0}.hero{box-shadow:none;border:2px solid #dbe8e8}.toolbar,.hint,.note{display:none}.scroll{overflow:visible}.schedule{min-width:1050px}.block{box-shadow:none}.print-only{display:block;text-align:center;font-size:11px;color:#81919b;margin-top:9px}@page{size:A4 landscape;margin:7mm}}
  /* Readable compact cards and a correctly scaled 7:45–21:00 grid. */
  .times,.col{min-height:650px}.time-label{height:60px}.col{background:repeating-linear-gradient(to bottom,rgba(255,255,255,.72) 0,rgba(255,255,255,.72) 74px,rgba(210,224,228,.65) 75px)}
  .block{min-height:22px;padding:5px 8px 4px 10px}.block strong{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.block.compact{padding:3px 7px 2px 8px}.block.compact .tag,.block.compact span{display:none}.block.compact strong{font-size:11px}
  .block-head{display:flex;align-items:center;gap:6px;min-width:0}.block-icon{width:27px;height:27px;flex:0 0 27px;border-radius:8px;object-fit:cover;background:rgba(255,255,255,.72);padding:2px}.block-emoji{font-size:20px;line-height:1}.block.compact .block-icon{width:20px;height:20px;flex-basis:20px}.block.compact .block-emoji{font-size:16px}.block.compact .block-head{gap:4px}
  .day{font-size:18px;padding:15px 5px}.day small{font-size:21px}.corner{font-size:14px}.block{min-height:50px;padding:7px 10px;border-radius:16px}.block strong{font-size:15px}.block span{font-size:12px;margin-top:4px}.block-icon{width:42px;height:42px;flex-basis:42px;border-radius:12px}.block-emoji{font-size:30px}.block.compact{min-height:50px;padding:7px 10px}.block.compact .tag{display:none}.block.compact span.time{display:block}.block.compact .block-icon{width:42px;height:42px;flex-basis:42px}.block.compact .block-emoji{font-size:30px}.block.compact .block-head{gap:7px}.block.compact strong{font-size:14px}.school-short{min-height:48px!important;padding:4px 10px!important}.school-short .block-icon{width:34px;height:34px;flex-basis:34px}.school-short .block-emoji{font-size:26px}
  .day small{display:block;font-size:14px;font-weight:900;color:#6e7d8e;margin-top:2px}.day em{display:block;font-style:normal;font-size:21px;line-height:1.05;margin-top:3px}.has-details{min-height:66px!important;padding:5px 8px!important}.has-details .block-icon{width:34px;height:34px;flex-basis:34px}.has-details .block-head{gap:5px}.has-details strong{font-size:13px}.has-details span.time{font-size:11px;margin-top:2px;white-space:nowrap}
  .cca-only{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:5px!important}.cca-only .tag,.cca-only strong{display:none}.cca-only .block-head{display:block}.cca-only .block-icon{width:48px;height:48px}.cca-only .block-emoji{font-size:40px}.cca-only .time{font-size:13px;margin-top:1px;font-weight:900;white-space:nowrap}
  .morning-short{min-height:60px!important;padding:4px 10px!important}.morning-short .block-icon{width:34px;height:34px;flex-basis:34px}.morning-short .block-emoji{font-size:26px}
  @media print{ @page{size:A4 landscape;margin:5mm} body{background:#fff}.app{width:100%;max-width:none;padding:0}.hero{padding:7px 12px;border-width:1px;border-radius:14px}.hero:after{font-size:16px;right:12px;top:8px}.eyebrow{font-size:8px}.hero h1{font-size:23px;margin:2px 0}.hero p{font-size:9px}.toolbar,.hint,.note{display:none}.legend{margin:4px 0;font-size:8px;gap:7px}.dot{width:8px;height:8px}.scroll{overflow:visible;padding:0}.schedule{min-width:0;width:100%;grid-template-columns:48px repeat(7,minmax(0,1fr));gap:2px}.corner,.day{border-radius:7px}.day{font-size:12px;padding:5px 2px}.day small{font-size:9px;margin-top:0}.day em{font-size:12px}.times,.col{min-height:650px}.time-label{font-size:8px}.block{left:2px;right:2px;border-width:1px;border-radius:8px;padding:2px 3px}.block strong{font-size:9px}.block span{font-size:8px}.block-icon{width:28px;height:28px}.block-emoji{font-size:20px}.cca-only .block-icon{width:32px;height:32px}.cca-only .block-emoji{font-size:24px}.cca-only .time{font-size:8px}.print-only{font-size:8px;margin-top:3px}}
  @media(max-width:800px){.app{padding:12px}.hero{padding:17px}.hero:after{font-size:20px;right:8px}.schedule{grid-template-columns:65px repeat(7,125px)}.times,.col{min-height:650px}.toolbar .btn{padding:9px 10px;font-size:12px}}
</style>
</head>
<body>
<main class="app">
  <section class="hero">
    <div class="eyebrow">OLIVIA'S HAPPY WEEK</div>
    <h1>我的一週時間表 🌈</h1>
    <p>拖動彩色小卡片來調整時間；點一下卡片即可修改內容。</p>
  </section>
  <div class="toolbar">
    <button class="btn primary" id="addBtn">＋ 新增活動</button>
    <button class="btn green" id="saveBtn">✓ 儲存我的編排</button>
    <button class="btn blue" id="printBtn">🖨 列印／另存 PDF</button>
    <button class="btn" id="pngBtn">🖼 下載卡通圖片</button>
    <button class="btn" id="resetBtn">↺ 還原初始表</button>
  </div>
  <p class="hint" id="hint">小提示：先按「儲存我的編排」，下次打開這個網頁會保留你的調整。列印時會自動隱藏操作按鈕。</p>
  <div class="legend">
    <span><i class="dot" style="background:#c9edff"></i>學校</span><span><i class="dot" style="background:#ffd6ad"></i>CCA</span><span><i class="dot" style="background:#e4dcff"></i>課外課程</span><span><i class="dot" style="background:#fff0ad"></i>作業</span><span><i class="dot" style="background:#cfead8"></i>睡覺</span>
  </div>
  <div class="scroll"><div class="schedule" id="schedule"></div></div>
  <div class="note">家長備註：這是一張可調整的家庭時間表。學校日間課程預設為 7:45–15:00；作業預設為 19:15–19:45；睡覺預設為 20:30–7:45。所有活動卡片都可以移動和修改。</div>
  <div class="print-only">Olivia 的一週時間表　｜　最後更新：<span id="printDate"></span></div>
</main>

<div class="modal" id="modal"><div class="dialog">
  <h2 id="modalTitle">新增活動</h2>
  <form class="form" id="form">
    <label>從表格選擇活動模板<select id="fPreset"><option value="custom">其他（自己輸入）</option></select></label>
    <label>活動名稱<input id="fTitle" required placeholder="例如：閱讀、作業、游泳" /></label>
    <div class="row"><label>星期<select id="fDay"><option value="0">星期一</option><option value="1">星期二</option><option value="2">星期三</option><option value="3">星期四</option><option value="4">星期五</option><option value="5">星期六</option><option value="6">星期日</option></select></label><label>類別<select id="fType"><option value="school">學校</option><option value="cca">CCA</option><option value="lesson">課外課程</option><option value="homework">作業</option><option value="sleep">睡覺</option><option value="life">生活</option></select></label></div>
    <div class="row"><label>開始時間<input id="fStart" type="time" required /></label><label>結束時間<input id="fEnd" type="time" required /></label></div>
    <label>顏色<div class="swatches" id="swatches"><button type="button" class="swatch" data-color="school" style="background:#c9edff"></button><button type="button" class="swatch" data-color="cca" style="background:#ffd6ad"></button><button type="button" class="swatch" data-color="lesson" style="background:#e4dcff"></button><button type="button" class="swatch" data-color="homework" style="background:#fff0ad"></button><button type="button" class="swatch" data-color="sleep" style="background:#cfead8"></button><button type="button" class="swatch" data-color="life" style="background:#ffd8e1"></button></div></label>
    <div class="dialog-actions"><button type="button" class="btn delete" id="deleteBtn">刪除</button><button type="button" class="btn blue" id="copyBtn">複製活動</button><button type="button" class="btn" id="cancelBtn">取消</button><button class="btn primary" type="submit">完成</button></div>
  </form>
</div></div>
<script>
const dayNames=['星期一','星期二','星期三','星期四','星期五','星期六','星期日'];
const dayEnglish=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const defaultBlocks=[
  ...[0,1,2,3,4].map(day=>({title:'學校上課',day,start:'07:45',end:'15:00',type:'school'})),
  ...[0,1,2,3,4].map(day=>({title:'寫作業',day,start:'19:15',end:'19:45',type:'homework'})),
  ...[0,1,2,3,4,5,6].map(day=>({title:'睡覺 💤',day,start:'20:30',end:'21:00',type:'sleep'})),
  {title:'Olivia 的 English class',day:0,start:'15:30',end:'17:00',type:'lesson'},
  {title:'久趣英語',day:0,start:'17:30',end:'17:55',type:'lesson'},
  {title:'Spark Math',day:0,start:'18:30',end:'19:15',type:'lesson'},
  {title:'Creative Art CCA',day:1,start:'15:15',end:'16:15',type:'cca'},
  {title:'游泳 CCA',day:1,start:'16:45',end:'17:30',type:'cca'},
  {title:'火狐英語',day:1,start:'18:30',end:'18:55',type:'lesson'},
  {title:'Netball CCA',day:2,start:'15:15',end:'16:15',type:'cca'},
  {title:'鋼琴課',day:2,start:'16:30',end:'17:00',type:'lesson'},
  {title:'Spark Math',day:2,start:'18:30',end:'19:15',type:'lesson'},
  {title:'跆拳道 CCA',day:3,start:'15:15',end:'16:15',type:'cca'},
  {title:'學而思補課',day:3,start:'17:30',end:'18:30',type:'lesson'},
  {title:'久趣英語',day:3,start:'18:30',end:'18:55',type:'lesson'},
  {title:'Reading Club CCA',day:4,start:'15:15',end:'16:15',type:'cca'},
  {title:'Spark Math',day:4,start:'18:30',end:'19:15',type:'lesson'},
  {title:'網球課',day:4,start:'17:00',end:'18:00',type:'lesson'},
  {title:'專注課程',day:5,start:'14:00',end:'15:30',type:'lesson'},
  {title:'學而思',day:5,start:'10:00',end:'11:40',type:'lesson'},
  {title:'多特體能訓練課',day:5,start:'16:00',end:'17:00',type:'lesson'},
  {title:'專注課程',day:6,start:'14:00',end:'15:30',type:'lesson'},
  {title:'Polly 英語',day:6,start:'10:00',end:'12:00',type:'lesson'},
  {title:'多特體能訓練課',day:6,start:'16:00',end:'17:00',type:'lesson'}
].map((b,i)=>({...b,id:'b'+i}));
let blocks=JSON.parse(localStorage.getItem('oliviaSchedule')||'null')||structuredClone(defaultBlocks);blocks=blocks.filter(b=>!(b.type==='sleep'&&b.start==='21:00'));blocks.forEach(b=>{if(b.title==='準備睡覺')b.title='睡覺 💤'});const ensureBlock=(title,day,start,end,type)=>{if(!blocks.some(b=>b.title===title&&b.day===day&&b.start===start))blocks.push({id:'extra-'+title+'-'+day+'-'+start,title,day,start,end,type})};ensureBlock('學而思',5,'10:00','11:40','lesson');ensureBlock('Polly 英語',6,'10:00','12:00','lesson');ensureBlock('網球課',4,'17:00','18:00','lesson');ensureBlock('多特體能訓練課',5,'16:00','17:00','lesson');ensureBlock('多特體能訓練課',6,'16:00','17:00','lesson');let editId=null;let dragId=null;let selectedColor='school';let clipboardBlock=null;let copyMode=false;
const startHour=7,startMin=45,pxPerMin=1.25,totalMins=13*60+15,schoolStart=startHour*60+startMin,schoolEnd=15*60,schoolVisualHeight=150;
function yForTime(m){if(m<=schoolEnd)return Math.max(0,(m-schoolStart)/(schoolEnd-schoolStart)*schoolVisualHeight);return schoolVisualHeight+(m-schoolEnd)*pxPerMin}
const iconMap={
  'Spark Math':{src:'spark-math.png',label:'Spark Math'},
  'Olivia 的 English class':{src:'female-english-teacher.png',label:'英語'},
  '久趣英語':{src:'pink-monkey-english.png',label:'適趣英語'},
  '久趣英语':{src:'pink-monkey-english.png',label:'適趣英語'},
  '火狐英語':{src:'classin-firefox-english.png',label:'火狐英語'},
  '火狐英语':{src:'classin-firefox-english.png',label:'火狐英語'},
  '學而思補課':{src:'xueersi.png',label:'學而思'},
  '學而思':{src:'xueersi.png',label:'學而思'},
  'Polly 英語':{src:'polly-english.png',label:'Polly 英語'},
  '睡覺 💤':{src:'sleep-girl-cutout.png',label:'8:30 睡覺'},
  '寫作業':{src:'homework-cutout.png',label:'寫作業'}
};
const emojiMap={school:'🏫',cca:'🌟',homework:'✏️',sleep:'💤',life:'🌈'};
function visualFor(b){if(iconMap[b.title])return {kind:'img',value:iconMap[b.title].src,alt:iconMap[b.title].label};if(b.title.includes('Creative')||b.title.includes('Art'))return {kind:'emoji',value:'🎨'};if(b.title.includes('游泳'))return {kind:'emoji',value:'🏊'};if(b.title.includes('Netball'))return {kind:'emoji',value:'🏐'};if(b.title.includes('網球')||b.title.includes('网球'))return {kind:'emoji',value:'🎾'};if(b.title.includes('多特')||b.title.includes('體能')||b.title.includes('体能'))return {kind:'emoji',value:'🏋️'};if(b.title.includes('跆拳道'))return {kind:'emoji',value:'🥋'};if(b.title.includes('Reading'))return {kind:'emoji',value:'📚'};if(b.title.includes('鋼琴'))return {kind:'emoji',value:'🎹'};if(b.title.includes('English')||b.title.includes('英語'))return {kind:'emoji',value:'🗣️'};if(b.title.includes('專注'))return {kind:'emoji',value:'🎯'};return {kind:'emoji',value:emojiMap[b.type]||'⭐'};}
function mins(t){const [h,m]=t.split(':').map(Number);return h*60+m}
function nice(t){let [h,m]=t.split(':').map(Number);let ap=h<12?'上午':'下午';let hh=h%12||12;return `${ap} ${hh}:${String(m).padStart(2,'0')}`}
function populatePresets(){const select=document.getElementById('fPreset');const current=select.value;select.innerHTML='<option value="custom">其他（自己輸入）</option>';[...new Set(blocks.map(b=>b.title))].sort().forEach(title=>{const option=document.createElement('option');option.value=title;option.textContent=iconMap[title]?.label||title;select.appendChild(option)});select.value=current||'custom'}
function usePreset(title){if(!title||title==='custom')return;const source=blocks.find(b=>b.title===title)||defaultBlocks.find(b=>b.title===title);if(!source)return;fTitle.value=source.title;fType.value=source.type;fStart.value=source.start;fEnd.value=source.end;selectedColor=source.type;markColor()}
function render(){const el=document.getElementById('schedule');el.innerHTML='';const corner=document.createElement('div');corner.className='corner';corner.textContent='時間';el.appendChild(corner);dayNames.forEach((d,i)=>{const h=document.createElement('div');h.className='day';h.innerHTML=`${d}<small>${dayEnglish[i]}</small><em>${['🌼','🎨','🎾','🥋','📚','⭐','☀️'][i]}</em>`;el.appendChild(h)});const times=document.createElement('div');times.className='times';const labels=[['7:45–3:00',150],['3:00',35],['4:00',75],['5:00',75],['6:00',75],['7:00',75],['8:00',75],['9:00',75]];labels.forEach(([text,height])=>{const lab=document.createElement('div');lab.className='time-label';lab.style.height=height+'px';lab.textContent=text;times.appendChild(lab)});el.appendChild(times);for(let d=0;d<7;d++){const col=document.createElement('div');col.className='col';col.dataset.day=d;col.addEventListener('dragover',e=>{e.preventDefault();col.classList.add('dragover')});col.addEventListener('dragleave',()=>col.classList.remove('dragover'));col.addEventListener('drop',e=>dropBlock(e,col));col.addEventListener('click',e=>pasteAt(e,col));blocks.filter(b=>b.day===d).forEach(b=>col.appendChild(makeBlock(b)));el.appendChild(col)}document.getElementById('printDate').textContent=new Date().toLocaleDateString('zh-HK');}
function makeBlock(b){const el=document.createElement('div');el.className=`block ${b.type}`;el.draggable=true;el.dataset.id=b.id;let s=mins(b.start);let e=mins(b.end);if(e<=s)e+=1440;let top=yForTime(s);const morningShort=s<schoolEnd&&e<=schoolEnd;let height=morningShort?60:b.type==='school'?60:b.type==='cca'?Math.max(70,(e-s)*pxPerMin):Math.max(50,(e-s)*pxPerMin);if(b.type==='school')el.classList.add('school-short');if(morningShort)el.classList.add('morning-short');if(b.type==='cca')el.classList.add('cca-only');if(b.type==='lesson'&&iconMap[b.title])el.classList.add('has-details');if(height<70&&!['cca','school'].includes(b.type)&&!morningShort)el.classList.add('compact');el.style.top=top+'px';el.style.height=height+'px';const v=visualFor(b);const icon=v.kind==='img'?`<img class="block-icon" src="${v.value}" alt="${v.alt}">`:`<span class="block-emoji" aria-hidden="true">${v.value}</span>`;const shownTitle=iconMap[b.title]?.label||b.title;el.innerHTML=b.type==='cca'?`<div class="block-head">${icon}</div><span class="time">${nice(b.start)}–${nice(b.end)}</span>`:`<span class="tag">${b.type==='lesson'?'課外課程':b.type==='homework'?'作業':b.type==='sleep'?'休息':'日程'}</span><div class="block-head">${icon}<strong>${shownTitle}</strong></div><span class="time">${nice(b.start)}–${nice(b.end)}</span>`;el.addEventListener('click',()=>openEdit(b.id));el.addEventListener('dragstart',()=>{dragId=b.id});return el}
function timeFromY(y){let m=y<=schoolVisualHeight?schoolStart+(y/schoolVisualHeight)*(schoolEnd-schoolStart):schoolEnd+(y-schoolVisualHeight)/pxPerMin;return Math.max(schoolStart,Math.min(21*60,Math.round(m/15)*15))}
function pasteAt(e,col){if(!copyMode||!clipboardBlock||e.target!==col)return;const rect=col.getBoundingClientRect();const start=timeFromY(e.clientY-rect.top);let dur=mins(clipboardBlock.end)-mins(clipboardBlock.start);if(dur<=0)dur+=1440;let end=start+dur;if(end>24*60)end-=24*60;blocks.push({...clipboardBlock,id:'copy-'+Date.now(),day:Number(col.dataset.day),start:String(Math.floor(start/60)).padStart(2,'0')+':'+String(start%60).padStart(2,'0'),end:String(Math.floor(end/60)).padStart(2,'0')+':'+String(end%60).padStart(2,'0')});copyMode=false;clipboardBlock=null;hint.textContent='已貼上活動，你可以繼續拖動或點擊修改。';render()}
function dropBlock(e,col){e.preventDefault();col.classList.remove('dragover');const b=blocks.find(x=>x.id===dragId);if(!b)return;const rect=col.getBoundingClientRect();const y=e.clientY-rect.top;let m=y<=schoolVisualHeight?schoolStart+(y/schoolVisualHeight)*(schoolEnd-schoolStart):schoolEnd+(y-schoolVisualHeight)/pxPerMin;m=Math.round(m/15)*15;m=Math.max(schoolStart,Math.min(21*60,m));let dur=mins(b.end)-mins(b.start);if(dur<=0)dur+=1440;let end=m+dur;if(end>24*60)end-=24*60;b.day=Number(col.dataset.day);b.start=String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');b.end=String(Math.floor(end/60)).padStart(2,'0')+':'+String(end%60).padStart(2,'0');render()}
function openEdit(id){editId=id;const b=blocks.find(x=>x.id===id);document.getElementById('modalTitle').textContent='修改活動';populatePresets();fPreset.value=[...fPreset.options].some(o=>o.value===b.title)?b.title:'custom';fTitle.value=b.title;fDay.value=b.day;fType.value=b.type;fStart.value=b.start;fEnd.value=b.end;selectedColor=b.type;markColor();deleteBtn.style.display='block';copyBtn.style.display='block';modal.classList.add('open')}
function openAdd(){editId=null;document.getElementById('modalTitle').textContent='新增活動';form.reset();populatePresets();fPreset.value='custom';fDay.value='0';fStart.value='15:00';fEnd.value='16:00';selectedColor='lesson';fType.value='lesson';markColor();deleteBtn.style.display='none';copyBtn.style.display='none';modal.classList.add('open')}
function markColor(){document.querySelectorAll('.swatch').forEach(x=>x.classList.toggle('selected',x.dataset.color===selectedColor))}
form.addEventListener('submit',e=>{e.preventDefault();const item={id:editId||'b'+Date.now(),title:fTitle.value.trim(),day:Number(fDay.value),start:fStart.value,end:fEnd.value,type:fType.value};if(editId)blocks=blocks.map(b=>b.id===editId?item:b);else blocks.push(item);modal.classList.remove('open');populatePresets();render()});fPreset.addEventListener('change',()=>usePreset(fPreset.value));copyBtn.onclick=()=>{const b=blocks.find(x=>x.id===editId);if(!b)return;clipboardBlock={...b};copyMode=true;modal.classList.remove('open');hint.textContent='已複製活動，請點擊任何一天的空白位置貼上。'};document.querySelectorAll('.swatch').forEach(x=>x.addEventListener('click',()=>{selectedColor=x.dataset.color;fType.value=selectedColor;markColor()}));cancelBtn.onclick=()=>modal.classList.remove('open');deleteBtn.onclick=()=>{blocks=blocks.filter(b=>b.id!==editId);modal.classList.remove('open');populatePresets();render()};addBtn.onclick=openAdd;saveBtn.onclick=()=>{localStorage.setItem('oliviaSchedule',JSON.stringify(blocks));saveBtn.textContent='✓ 已儲存';setTimeout(()=>saveBtn.textContent='✓ 儲存我的編排',1300)};resetBtn.onclick=()=>{if(confirm('要還原成初始時間表嗎？')){blocks=structuredClone(defaultBlocks);localStorage.removeItem('oliviaSchedule');populatePresets();render()}};printBtn.onclick=()=>window.print();
function downloadPNG(){const W=1800,H=1120,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.fillStyle='#fffdf7';x.fillRect(0,0,W,H);x.fillStyle='#264c67';x.font='bold 46px KaiTi';x.fillText('Olivia 的一週時間表 🌈',60,70);x.fillStyle='#6e7d8e';x.font='22px KaiTi';x.fillText('拖動卡片調整｜學校 7:45–15:00｜晚上 8:30 開始準備睡覺',62,108);const left=95,top=145,gridW=1650,dayW=gridW/7,rowH=60;dayNames.forEach((d,i)=>{x.fillStyle='#dff4ff';x.fillRect(left+i*dayW,top,dayW-6,48);x.fillStyle='#355267';x.font='bold 22px KaiTi';x.fillText(d,left+i*dayW+dayW/2-35,top+31)});for(let h=8;h<=20;h++){let y=top+60+(h-8)*rowH;x.strokeStyle='#d8e3e8';x.beginPath();x.moveTo(left,y);x.lineTo(left+gridW,y);x.stroke();x.fillStyle='#8796a0';x.font='16px KaiTi';x.fillText((h>12?h-12:h)+':00',20,y+5)}const colors={school:'#c9edff',cca:'#ffd6ad',lesson:'#e4dcff',homework:'#fff0ad',sleep:'#cfead8',life:'#ffd8e1'};blocks.forEach(b=>{let s=mins(b.start),e=mins(b.end);if(e<=s)e+=1440;if(e<7*60+45||s>21*60)return;let y=top+60+(s-8*60)*rowH/60;let h=Math.max(30,(e-s)*rowH/60);let xx=left+b.day*dayW+7;x.fillStyle=colors[b.type]||'#eee';x.beginPath();x.roundRect(xx,y,dayW-20,h,12);x.fill();x.fillStyle='#27364b';x.font='bold 16px KaiTi';x.fillText(b.title.slice(0,18),xx+10,y+23);x.font='13px KaiTi';x.fillText(b.start+'–'+b.end,xx+10,y+43)});x.fillStyle='#78909c';x.font='16px KaiTi';x.fillText('可在網頁中點擊、拖動或新增活動後再下載',60,H-30);const a=document.createElement('a');a.download='Olivia一週時間表.png';a.href=c.toDataURL('image/png');a.click()}
pngBtn.onclick=downloadPNG;populatePresets();render();
</script>
</body></html>
